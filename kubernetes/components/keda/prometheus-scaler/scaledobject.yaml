---
# yaml-language-server: $schema=https://schemas.tholinka.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${SCALER_SILENT}${APP}
spec:
  advanced:
    restoreToOriginalReplicaCount: true
  scaleTargetRef:
    apiVersion: ${SCALER_API_VERSION:=apps/v1}
    kind: ${SCALER_TYPE:=Deployment}
    name: ${SCALER_NAME:=${APP}}
  cooldownPeriod: 0
  minReplicaCount: ${SCALER_MIN_REPLICAS:=0}
  maxReplicaCount: ${SCALER_MAX_REPLICAS:=1}
  triggers:
    - type: prometheus
      metadata:
        # VictoriaMetrics single-node PromQL-compatible query API. Previously
        # pointed at prometheus-operated:9090, which doesn't exist in this
        # cluster (VM stack, not kube-prometheus-stack). Overridable via
        # SCALER_PROM_ADDRESS.
        serverAddress: ${SCALER_PROM_ADDRESS:=http://vmsingle-victoria-metrics.observability.svc.cluster.local.:8428}
        query: ${SCALER_QUERY}
        threshold: '${SCALER_THRESHOLD:="1"}'
        ignoreNullValues: '${SCALER_IGNORE_NULL:="0"}'
