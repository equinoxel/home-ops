---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../prometheus-scaler
patches:
  - patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/query
        # Matches the blackbox NFS probe, which relabels its instance to
        # nas.servers.internal (see apps/observability/blackbox-exporter probes.yaml).
        # DNS-based and node-agnostic — don't hardcode a node IP/VIP here.
        value: max_over_time(probe_success{instance="nas.servers.internal"}[1m])
    target: &target
      group: keda.sh
      kind: ScaledObject
  - patch: |-
      - op: replace
        path: /metadata/name
        value: silent-${APP}
    target: *target
