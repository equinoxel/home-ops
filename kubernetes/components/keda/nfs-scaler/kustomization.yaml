---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../prometheus-scaler
patches:
  - patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/query
        # Matches the blackbox NFS probe, which relabels its instance to the
        # literal NAS IP (see apps/observability/blackbox-exporter probes.yaml).
        # Deliberately IP-based, NOT nas.servers.internal: the probe/scaler must
        # not depend on Pi-hole DNS, since Pi-hole being down would fail the
        # probe and hold this scaler at 0 replicas.
        value: max_over_time(probe_success{instance="192.168.2.44:2049"}[1m])
    target: &target
      group: keda.sh
      kind: ScaledObject
  - patch: |-
      - op: replace
        path: /metadata/name
        value: silent-${APP}
    target: *target
