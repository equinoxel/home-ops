---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-external-routes
  namespace: &namespace network-system
spec:
  interval: 1h
  dependsOn:
    - name: envoy-gateway-config
  path: ./kubernetes/apps/network-system/envoy-gateway/external-routes
  postBuild:
    substituteFrom:
      - name: cluster-settings
        kind: ConfigMap
      # Routes use ${SECRET_DOMAIN}, which lives in the SOPS cluster-secrets
      # Secret (not the cluster-settings ConfigMap).
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
