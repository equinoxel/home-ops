---
# Reverse-proxy route for TrueNAS web UI -> http://192.168.2.44:80
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: nas
spec:
  endpoints:
    - ip:
        address: 192.168.2.44
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nas
spec:
  hostnames: ["nas.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network-system
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: nas
          port: 80
