---
# Reverse-proxy route for RustFS web console -> http://192.168.2.44:30293
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: rustfs
spec:
  endpoints:
    - ip:
        address: 192.168.2.44
        port: 30293
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
spec:
  hostnames: ["rustfs.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network-system
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: rustfs
          port: 30293
