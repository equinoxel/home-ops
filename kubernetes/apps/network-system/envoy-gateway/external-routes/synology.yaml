---
# Reverse-proxy route for Synology DSM web UI -> http://192.168.6.20:5000
#
# NFS (TCP/UDP 2049) and SMB (TCP 445) are not HTTP protocols and cannot be
# proxied through Envoy Gateway. The DNSEndpoint below publishes a direct A
# record (synology.<domain> -> 192.168.6.20) so those protocols reach the
# machine directly. The HTTPRoute also resolves to the same hostname but
# pihole-external-dns will overwrite it with the direct IP via the DNSEndpoint
# (DNSEndpoint takes precedence over gateway-httproute in noop registry mode).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: synology
spec:
  endpoints:
    - ip:
        address: 192.168.6.20
        port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synology
spec:
  hostnames: ["synology.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network-system
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: synology
          port: 5000
---
# Direct A record for NFS/SMB access (bypasses Envoy entirely).
# pihole-external-dns picks this up via the CRD source.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: synology
spec:
  endpoints:
    - dnsName: "synology.${SECRET_DOMAIN}"
      recordType: A
      targets: ["192.168.6.20"]

