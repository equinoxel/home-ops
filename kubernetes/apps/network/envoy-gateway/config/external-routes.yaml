# ---------------------------------------------------------------------------
# RustFS S3 API  ->  http://192.168.2.44:30292   (served at hostname root)
# ---------------------------------------------------------------------------
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: s3
spec:
  endpoints:
    - ip:
        address: 192.168.2.44
        port: 30292
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3
spec:
  hostnames: ["s3.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: s3
          port: 30292
