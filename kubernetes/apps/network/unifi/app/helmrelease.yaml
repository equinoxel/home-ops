---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi
spec:
  interval: 1h
  timeout: 15m
  install:
    disableWait: true
  upgrade:
    disableWait: true
    cleanupOnFail: true
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      nodeSelector:
        node.kubernetes.io/intel: ""
    controllers:
      *app:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          hostAliases:
            - ip: "127.0.0.1"
              hostnames:
                - "host.docker.internal"
        initContainers:
          init-dirs:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - |
                mkdir -p /volume/persistent /volume/log /volume/data /volume/srv /volume/unifi /volume/mongodb /volume/rabbitmq
                chmod 777 /volume/persistent /volume/log /volume/srv /volume/unifi /volume/mongodb /volume/rabbitmq /volume/data
                if [ -d /volume/data/postgresql/14/main/data ]; then
                  chmod 0700 /volume/data/postgresql/14/main/data
                fi
            securityContext:
              privileged: true
        containers:
          app:
            image:
              repository: ghcr.io/lemker/unifi-os-server
              tag: v1.7.0
            command:
              - /bin/bash
              - -c
              - |
                [ -d /data/postgresql/14/main/data ] && chmod 0700 /data/postgresql/14/main/data
                sed -i '/WatchdogSec=/d' /lib/systemd/system/unifi-core.service
                rm -f /lib/systemd/system/nginx.service.d/stale-config-cleanup.conf
                mkdir -p /etc/systemd/system/unifi-core.service.d
                printf "[Service]\nType=simple\n" > /etc/systemd/system/unifi-core.service.d/override.conf
                mkdir -p /etc/systemd/system/uos-agent.service.d
                printf "[Service]\nType=simple\n" > /etc/systemd/system/uos-agent.service.d/override.conf
                mkdir -p /etc/systemd/system/unifi.service.d
                printf "[Service]\nType=simple\n" > /etc/systemd/system/unifi.service.d/override.conf
                exec /root/uos-entrypoint.sh
            env:
              TZ: Europe/Bucharest
              UOS_SYSTEM_IP: "192.168.2.161"
              HARDWARE_PLATFORM: "synology"
            securityContext:
              privileged: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 80
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 10
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 1536Mi
              limits:
                memory: 4Gi
    service:
      app:
        controller: *app
        forceRename: *app
        ports:
          http:
            port: &port 80
            protocol: TCP
            appProtocol: http
      stun:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "${SVC_UNIFI_STUN_IP}"
        ports:
          stun:
            port: 3478
            protocol: UDP
          discovery:
            port: 10003
            protocol: UDP
          discovery-legacy:
            port: 10001
            protocol: UDP
          inform:
            port: 8080
            protocol: TCP
          syslog:
            port: 5514
            protocol: UDP
          speedtest:
            port: 6789
            protocol: TCP
    route:
      app:
        hostnames:
          - "unifi.laurivan.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
            timeouts:
              request: 0s
              backendRequest: 0s
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          *app:
            init-dirs:
              - path: /volume
            app:
              - path: /persistent
                subPath: persistent
              - path: /var/log
                subPath: log
              - path: /data
                subPath: data
              - path: /srv
                subPath: srv
              - path: /var/lib/unifi
                subPath: unifi
              - path: /var/lib/mongodb
                subPath: mongodb
              - path: /etc/rabbitmq/ssl
                subPath: rabbitmq
