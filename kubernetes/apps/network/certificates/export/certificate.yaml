---
# yaml-language-server: $schema=https://schemas.tholinka.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: laurivan-com
spec:
  secretName: 'laurivan-com-tls'
  # Match the ECDSA key of the cert seeded from Bitwarden (import/externalsecret).
  # Without this, cert-manager defaults to RSA, sees a key-algorithm mismatch
  # against the seeded EC key (SecretMismatch), and refuses to renew — leaving
  # the wildcard cert expired and every *.laurivan.com app behind a 502.
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - laurivan.com
    - '*.laurivan.com'
  usages:
    - 'digital signature'