---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pihole
  namespace: &namespace network
spec:
  interval: 1h
  targetNamespace: *namespace
  components:
    # Emits a separate `pihole-observability` Flux Kustomization that owns the
    # Grafana dashboard and carries `dependsOn: grafana`. Keeps DNS independent
    # of Grafana, so pihole reconciles even when Grafana is down or starved.
    - ../../../../components/observability
  path: ./kubernetes/apps/network/pihole/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: storage-ready
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: *namespace
      OBSERVABILITY_PATH: ./kubernetes/apps/network/pihole/observability
  wait: true
