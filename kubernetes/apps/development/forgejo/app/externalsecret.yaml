---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-signing
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-signing
    creationPolicy: Owner
    template:
      data:
        signing_private_key: "{{ .FORGEJO_SIGNING_PRIVATE_KEY }}"
        signing_public_key: "{{ .FORGEJO_SIGNING_PUBLIC_KEY }}"
  dataFrom:
    - extract:
        key: forgejo
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-oidc
    creationPolicy: Owner
    template:
      data:
        key: "{{ .FORGEJO_OIDC_CLIENT_ID }}"
        secret: "{{ .FORGEJO_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: forgejo
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-s3-secret
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
  dataFrom:
    - extract:
        key: volsync_s3_template
