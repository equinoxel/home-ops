---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 30m
  values:
    configMaps:
      config:
        suffix: config
        data:
          runner.yaml: |-
            cache:
              enabled: true
              dir: /data/cache
            container:
              docker_host: tcp://127.0.0.1:2375
              workdir_parent: /data/workdir
              valid_volumes:
                - '**'
            log:
              level: info
            runner:
              capacity: 2
              file: /data/.runner
              labels:
                - default:docker://node:20-bookworm
                - ubuntu-latest:docker://node:20-bookworm
                - ubuntu-24.04:docker://node:20-bookworm
                - docker:docker://node:20-bookworm
                - dind:docker://docker:dind
              timeout: 3h
    controllers:
      forgejo-runner:
        type: statefulset
        replicas: 1
        pod:
          labels:
            app.kubernetes.io/component: forgejo-runner
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          register-runner:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 6.2.2
            command:
              - sh
              - -c
              - |
                if [ -f /data/.runner ]; then
                  echo "Runner already registered, skipping"
                  exit 0
                fi
                echo "Registering runner..."
                CLEAN_TOKEN=$(echo "${RUNNER_TOKEN}" | tr -d '[:space:]')
                cd /data && forgejo-runner register \
                  --instance http://forgejo-http.development.svc.cluster.local:3000 \
                  --token "${CLEAN_TOKEN}" \
                  --name k8s-runner \
                  --labels "default:docker://node:20-bookworm,ubuntu-latest:docker://node:20-bookworm,ubuntu-24.04:docker://node:20-bookworm,docker:docker://node:20-bookworm,dind:docker://docker:dind" \
                  --config /config/runner.yaml \
                  --no-interactive
            env:
              - name: RUNNER_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: token
                    name: forgejo-runner-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              readOnlyRootFilesystem: true
        containers:
          dind:
            image:
              repository: docker
              tag: dind
            command:
              - dockerd
              - --tls=false
              - --host=tcp://0.0.0.0:2375
              - --host=unix:///var/run/docker.sock
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              privileged: true
              runAsUser: 0
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - docker
                      - info
                  initialDelaySeconds: 2
                  periodSeconds: 2
                  failureThreshold: 10
          runner:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 6.2.2
            command:
              - /bin/forgejo-runner
              - daemon
              - --config
              - /config/runner.yaml
            env:
              - name: DOCKER_HOST
                value: tcp://127.0.0.1:2375
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              readOnlyRootFilesystem: true
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config
      tmpfs:
        type: emptyDir
        sizeLimit: 10Gi
        globalMounts:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: tmp
      dind-storage:
        type: emptyDir
        sizeLimit: 20Gi
        advancedMounts:
          forgejo-runner:
            dind:
              - path: /var/lib/docker
    serviceAccount:
      forgejo-runner: {}
