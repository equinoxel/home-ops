---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app papra
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/papra-hq/papra
              tag: 26.6.2-rootless
            env:
              TZ: Europe/Bucharest
              PORT: &port 1221
              APP_BASE_URL: https://docs.laurivan.com
              AUTH_IS_REGISTRATION_ENABLED: "false"
              # Document storage: S3 (RustFS). The SQLite database still lives on
              # the PVC at /app/app-data/db; only document blobs go to S3.
              DOCUMENT_STORAGE_DRIVER: s3
              DOCUMENT_STORAGE_S3_REGION: auto
              # RustFS is path-style (endpoint/bucket/key), not virtual-host, so
              # this must be true or uploads 404.
              DOCUMENT_STORAGE_S3_FORCE_PATH_STYLE: "true"
              # Endpoint, bucket, and credentials come from the papra secret
              # (see externalsecret.yaml).
              # AI features (Ollama). Disabled until an Ollama endpoint exists.
              # To enable: flip AI_IS_ENABLED to "true", uncomment AI_DEFAULT_MODEL,
              # and point OLLAMA_BASE_URL at a real endpoint (keep the /v1 suffix).
              AI_IS_ENABLED: "false"
              AUTO_TAGGING_ENABLED: "true"
              # Model nomenclature is <adapter>://<model>, e.g. ollama://qwen3:8b.
              #AI_DEFAULT_MODEL: ollama://qwen3:8b
              # Ollama ignores auth, so "ollama" is the conventional no-auth key.
              # These are plain placeholders (not secrets); set a real base URL
              # before enabling AI.
              OLLAMA_API_KEY: ollama
              OLLAMA_BASE_URL: http://ollama.ollama.svc.cluster.local:11434/v1
            envFrom:
              - secretRef:
                  name: *app
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "papra.laurivan.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/app-data
