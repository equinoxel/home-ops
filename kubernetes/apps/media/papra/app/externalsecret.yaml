---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name papra
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        AUTH_SECRET: '{{ .AUTH_SECRET }}'
        # Authentik SSO via better-auth generic OAuth. The client secret stays
        # in Bitwarden; the rest of the provider config is assembled here so the
        # Authentik login button shows up on the Papra sign-in page.
        AUTH_PROVIDERS_CUSTOMS: |
          [
            {
              "providerId": "authentik",
              "providerName": "Authentik",
              "providerIconUrl": "https://api.iconify.design/simple-icons:authentik.svg",
              "type": "oidc",
              "discoveryUrl": "https://auth.laurivan.com/application/o/papra/.well-known/openid-configuration",
              "clientId": "{{ .PAPRA_OIDC_CLIENT_ID }}",
              "clientSecret": "{{ .PAPRA_OIDC_CLIENT_SECRET }}",
              "scopes": ["openid", "profile", "email"]
            }
          ]
        # S3 document storage on RustFS. Credentials are the shared RustFS keys
        # from the cloudnative_pg item; the bucket is dedicated ("papra"). The
        # shared S3 endpoint is stored without a scheme, but Papra's S3 driver
        # (AWS SDK) needs a full URL, so prepend http://.
        DOCUMENT_STORAGE_S3_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        DOCUMENT_STORAGE_S3_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
        DOCUMENT_STORAGE_S3_BUCKET_NAME: documents
        DOCUMENT_STORAGE_S3_ENDPOINT: 'http://{{ .S3_POSTGRES_STORAGE | trimPrefix "https://" | trimPrefix "http://" }}'
        # Ollama API key. Papra defaults this to "ollama"; kept here so a real
        # key (or the "ollama" placeholder) is delivered when AI is enabled.
        # Set OLLAMA_BASE_URL to the in-cluster Ollama endpoint (with /v1),
        # e.g. http://ollama.<namespace>.svc.cluster.local:11434/v1
        OLLAMA_API_KEY: '{{ .OLLAMA_API_KEY }}'
        OLLAMA_BASE_URL: '{{ .OLLAMA_BASE_URL }}'
  dataFrom:
    - extract:
        key: papra
    # Shared RustFS S3 credentials + endpoint (reused by Postgres/MariaDB).
    - extract:
        key: cloudnative_pg
