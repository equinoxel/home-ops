---
# yaml-language-server: $schema=https://schemas.tholinka.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  driftDetection:
    ignore:
      - paths: [/spec/replicas]
  values:
    # if I ever lose the db, my setup is based heavily on https://github.com/joryirving/home-ops/tree/77478606352bfb43e6c1c5fcf0b5fa134d007095/terraform/authentik
    global:
      podAnnotations:
        reloader.stakater.com/auto: 'true'
      deploymentStrategy:
        type: RollingUpdate
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      envFrom:
        - secretRef:
            name: &secret authentik-secret
      # verify-ca: encrypt + verify the server cert against the CA, skip hostname
      # verification (postgres reached via a stable in-cluster service DNS name).
      # SSL* values are BARE FILE PATHS (per authentik docs: "Path to the ...
      # file"). Do NOT use the file:// prefix here — authentik's config loader
      # treats file://<x> as "read file <x> and use its contents as the value",
      # which would pass the PEM *content* where libpq expects a path.
      env:
        # Reuse Postgres connections across requests instead of opening a new
        # one every request. With conn_max_age=0 (the default) every request
        # pays a fresh TLS handshake (sslmode=verify-ca) to postgres, which
        # dominates request latency — a no-op health endpoint measured ~1s.
        # authentik 2026.8.x runs cache/sessions/task-broker/channels on
        # Postgres, so connection churn hits the whole login path.
        - name: AUTHENTIK_POSTGRESQL__CONN_MAX_AGE
          value: '300'
        - name: AUTHENTIK_POSTGRESQL__CONN_HEALTH_CHECKS
          value: 'true'
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: verify-ca
        - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
          value: /var/run/secrets/postgresql/ca.crt
        - name: AUTHENTIK_POSTGRESQL__SSLCERT
          value: /var/run/secrets/postgresql/tls.crt
        - name: AUTHENTIK_POSTGRESQL__SSLKEY
          value: /var/run/secrets/postgresql/tls.key
      volumeMounts:
        - name: postgres-certs
          mountPath: /var/run/secrets/postgresql
      volumes:
        - name: postgres-certs
          secret:
            defaultMode: 0440
            secretName: postgres-authentik-cert
    authentik:
      postgresql:
        host: postgres-cluster-rw.database.svc.cluster.local
        name: *app
        user: *app
      email:
        port: 587
        use_tls: true
    server:
      autoscaling: &autoscaling
        enabled: true
        minReplicas: 1
        maxReplicas: 1
        targetCPUUtilizationPercentage: 60
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 300
          scaleDown:
            stabilizationWindowSeconds: 300
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      autoscaling: *autoscaling
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      startupProbe:
        timeoutSeconds: 20
        failureThreshold: 30
        periodSeconds: 20
      livenessProbe:
        timeoutSeconds: 20
        failureThreshold: 6
        periodSeconds: 60
    prometheus:
      rules:
        enabled: true
  valuesFrom:
    - targetPath: authentik.email.host
      kind: Secret
      name: *secret
      valuesKey: EMAIL_SERVER
    - targetPath: authentik.email.username
      kind: Secret
      name: *secret
      valuesKey: EMAIL_USER
    - targetPath: authentik.email.from
      kind: Secret
      name: *secret
      valuesKey: EMAIL_FROM
    - targetPath: authentik.email.password
      kind: Secret
      name: *secret
      valuesKey: EMAIL_PASS
