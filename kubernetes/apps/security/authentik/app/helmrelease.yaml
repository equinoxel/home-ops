---
# yaml-language-server: $schema=https://schemas.tholinka.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  driftDetection:
    ignore:
      - paths: [/spec/replicas]
  values:
    # if I ever lose the db, my setup is based heavily on https://github.com/joryirving/home-ops/tree/77478606352bfb43e6c1c5fcf0b5fa134d007095/terraform/authentik
    global:
      podAnnotations:
        reloader.stakater.com/auto: 'true'
      deploymentStrategy:
        type: RollingUpdate
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      envFrom:
        - secretRef:
            name: &secret authentik-secret
      # NOTE: SSL cert *paths* are set per-controller (server vs worker), not
      # here, because the chart concatenates global.env with <controller>.env —
      # setting them in both places produces duplicate env keys that SSA rejects.
      # The Python server wants bare paths; the Rust worker (2026.5) needs
      # file:// paths or it errors "no keys found pem file"
      # (goauthentik/authentik#22589).
      env:
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: verify-full
      volumeMounts:
        - name: postgres-certs
          mountPath: /var/run/secrets/postgresql
      volumes:
        - name: postgres-certs
          secret:
            defaultMode: 0440
            secretName: postgres-authentik-cert
    authentik:
      postgresql:
        host: postgres-cluster-rw.database.svc.cluster.local
        name: *app
        user: *app
      email:
        port: 587
        use_tls: true
    server:
      # Python server: bare cert paths.
      env:
        - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
          value: /var/run/secrets/postgresql/ca.crt
        - name: AUTHENTIK_POSTGRESQL__SSLCERT
          value: /var/run/secrets/postgresql/tls.crt
        - name: AUTHENTIK_POSTGRESQL__SSLKEY
          value: /var/run/secrets/postgresql/tls.key
      autoscaling: &autoscaling
        enabled: true
        minReplicas: 1
        maxReplicas: 1
        targetCPUUtilizationPercentage: 60
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 300
          scaleDown:
            stabilizationWindowSeconds: 300
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      # The Rust worker (2026.5) treats AUTHENTIK_POSTGRESQL__SSL* values as
      # inline PEM unless prefixed with file:// — a bare path yields
      # "no keys found pem file". The Python server wants the bare path, so
      # override just the worker here. See goauthentik/authentik#22589.
      env:
        - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
          value: file:///var/run/secrets/postgresql/ca.crt
        - name: AUTHENTIK_POSTGRESQL__SSLCERT
          value: file:///var/run/secrets/postgresql/tls.crt
        - name: AUTHENTIK_POSTGRESQL__SSLKEY
          value: file:///var/run/secrets/postgresql/tls.key
      autoscaling: *autoscaling
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      startupProbe:
        timeoutSeconds: 20
        failureThreshold: 30
        periodSeconds: 20
      livenessProbe:
        timeoutSeconds: 20
        failureThreshold: 6
        periodSeconds: 60
    prometheus:
      rules:
        enabled: true
  valuesFrom:
    - targetPath: authentik.email.host
      kind: Secret
      name: *secret
      valuesKey: EMAIL_SERVER
    - targetPath: authentik.email.username
      kind: Secret
      name: *secret
      valuesKey: EMAIL_USER
    - targetPath: authentik.email.from
      kind: Secret
      name: *secret
      valuesKey: EMAIL_FROM
    - targetPath: authentik.email.password
      kind: Secret
      name: *secret
      valuesKey: EMAIL_PASS
