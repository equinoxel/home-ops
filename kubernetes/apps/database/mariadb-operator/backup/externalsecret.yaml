---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: mariadb-backup-secret
    template:
      data:
        # S3 credentials consumed directly by the Backup CRD via secretKeyRefs.
        # Reuses the same Postgres/RustFS bucket credentials.
        AWS_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
        # Endpoint and bucket are plain strings on the Backup CRD (not
        # secretKeyRefs), so they are surfaced here and injected into backup.yaml
        # via the Flux Kustomization's postBuild.substituteFrom.
        #
        # The mariadb-operator S3 endpoint must NOT include a scheme, but the
        # shared S3_POSTGRES_STORAGE value is a full URL (https://...). Strip the
        # scheme so the same Bitwarden field can be reused unchanged.
        S3_MARIADB_ENDPOINT: '{{ .S3_POSTGRES_STORAGE | trimPrefix "https://" | trimPrefix "http://" }}'
        S3_MARIADB_BUCKET: '{{ .S3_POSTGRES_BUCKET }}'
  dataFrom:
    - extract:
        key: cloudnative_pg
