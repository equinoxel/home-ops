---
# yaml-language-server: $schema=https://schemas.tholinka.dev/barmancloud.cnpg.io/objectstore_v1.json
# technically we only need one of these per namespace...
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-${APP}
spec:
  retentionPolicy: 30d
  configuration:
    # SSE (AES256) disabled: RustFS SSE-S3 requires a configured KMS backend,
    # which isn't set up. Backups remain bzip2-compressed but not encrypted at
    # rest. Re-add `encryption: AES256` here if/when RustFS KMS is configured.
    wal:
      compression: bzip2
      maxParallel: 8
    data:
      compression: bzip2
    destinationPath: s3://${S3_POSTGRES_BUCKET}/
    endpointURL: ${S3_POSTGRES_STORAGE}
    s3Credentials:
      accessKeyId:
        name: &secret ${APP}-cnpg-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: *secret
        key: AWS_SECRET_ACCESS_KEY
