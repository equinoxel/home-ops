---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      gluetun:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          coredns:
            image:
              repository: mirror.gcr.io/coredns/coredns
              tag: 1.13.1
            args:
              - -conf
              - /etc/coredns/Corefile
            restartPolicy: Always
        containers:
          app:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.40.0
            env:
              - name: VPN_SERVICE_PROVIDER
                value: protonvpn
              - name: VPN_TYPE
                value: wireguard
              - name: FREE_ONLY
                value: "on"
              - name: DOT
                value: "off"
              - name: DNS_ADDRESS
                value: "127.0.0.2"
              - name: HTTPPROXY
                value: "on"
              - name: HTTPPROXY_LOG
                value: "on"
              - name: HTTPPROXY_LISTENING_ADDRESS
                value: ":8888"
              - name: HTTPPROXY_STEALTH
                value: "on"
              - name: FIREWALL_INPUT_PORTS
                value: "8888,8000,1080"
              - name: FIREWALL_OUTBOUND_SUBNETS
                value: "10.42.0.0/16,10.43.0.0/16,192.168.0.0/16"
            envFrom:
              - secretRef:
                  name: gluetun-proxy-vpn
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              allowPrivilegeEscalation: false
            probes:
              liveness: &gluetunProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/publicip/ip
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *gluetunProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/publicip/ip
                    port: 8000
                  timeoutSeconds: 10
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          socks5:
            dependsOn:
              - app
            image:
              repository: docker.io/serjs/go-socks5-proxy
              tag: latest
            env:
              - name: REQUIRE_AUTH
                value: "false"
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    persistence:
      coredns:
        type: configMap
        name: gluetun-coredns
        advancedMounts:
          gluetun:
            coredns:
              - path: /etc/coredns/Corefile
                subPath: Corefile
                readOnly: true
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: 8888
          socks5:
            port: 1080
          control:
            port: 8000
