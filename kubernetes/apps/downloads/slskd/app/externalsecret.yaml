---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-vpn
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: slskd-vpn
    template:
      engineVersion: v2
      data:
        WIREGUARD_PRIVATE_KEY: '{{- if hasPrefix "{" (trim .RAW_KEY) -}}{{ (fromJson .RAW_KEY).WIREGUARD_PRIVATE_KEY }}{{- else -}}{{ trim .RAW_KEY }}{{- end -}}'
  data:
    - secretKey: RAW_KEY
      remoteRef:
        key: protonvpn-slskd
