---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      slskd:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1005
            fsGroupChangePolicy: "OnRootMismatch"
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.1
            nameOverride: slskd
            env:
              DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp
              SLSKD_HTTP_PORT: &port 5030
              SLSKD_NO_AUTH: "true"
              SLSKD_NO_HTTPS: "true"
              SLSKD_NO_VERSION_CHECK: "true"
              SLSKD_REMOTE_CONFIGURATION: "true"
              SLSKD_APP_DIR: /config
              SLSKD_SLSK_PROXY: "true"
              SLSKD_SLSK_PROXY_ADDRESS: gluetun.downloads.svc.cluster.local
              SLSKD_SLSK_PROXY_PORT: 1080
              SLSKD_SHARED_DIR: /data/nas-media/Downloads/slskd/shared
              SLSKD_DOWNLOADS_DIR: /data/nas-media/Downloads/slskd/complete
              SLSKD_INCOMPLETE_DIR: /data/nas-media/Downloads/slskd/incomplete
              SLSKD_METRICS: "true"
              SLSKD_METRICS_NO_AUTH: "true"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1005
              runAsNonRoot: true
              runAsUser: 1003
    persistence:
      config:
        existingClaim: slskd
        advancedMounts:
          slskd:
            app:
              - path: /config
      downloads:
        type: nfs
        path: /mnt/Main/shares
        server: 192.168.2.44
        advancedMounts:
          slskd:
            app:
              - path: /data/nas-media/Downloads/slskd
                subPath: Downloads/slskd
      tmp:
        type: emptyDir
        advancedMounts:
          slskd:
            app:
              - path: /tmp
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: slskd
          gethomepage.dev/icon: slskd.png
        hostnames:
          - slskd.laurivan.com
        parentRefs:
          - name: envoy-internal
            namespace: network-system
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: slskd
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
