---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: synology-backup-secret
    creationPolicy: Owner
    template:
      data:
        # Synology NAS parameters (from Bitwarden item: synology)
        SYNOLOGY_NFS_SERVER: '{{ .SYNOLOGY_NFS_SERVER }}'
        SYNOLOGY_NFS_PATH: '{{ .SYNOLOGY_NFS_PATH }}'

        # TrueNAS S3 / RustFS credentials (reused from existing item: volsync_s3_template)
        AWS_S3_ENDPOINT: '{{ .AWS_S3_ENDPOINT }}'
        AWS_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'

        # Optional S3 bucket list (defaults to "auto" to automatically discover and back up all RustFS buckets)
        BACKUP_S3_BUCKETS: '{{ .BACKUP_S3_BUCKETS | default "auto" }}'
  dataFrom:
    # 1. Reuses existing RustFS S3 credentials (no duplication needed in Bitwarden!)
    - extract:
        key: volsync_s3_template
    # 2. Pulls Synology connection details (only NAS server & mount path needed)
    - extract:
        key: synology
