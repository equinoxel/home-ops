---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: synology-backup-secret
    creationPolicy: Owner
    template:
      data:
        SYNOLOGY_NFS_SERVER: '{{ .SYNOLOGY_NFS_SERVER }}'
        SYNOLOGY_NFS_PATH: '{{ .SYNOLOGY_NFS_PATH }}'
        TRUENAS_NFS_SERVER: '{{ .TRUENAS_NFS_SERVER }}'
        TRUENAS_PHOTOS_NFS_PATH: '{{ .TRUENAS_PHOTOS_NFS_PATH }}'
        AWS_S3_ENDPOINT: '{{ .AWS_S3_ENDPOINT }}'
        AWS_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
        VOLSYNC_S3_BUCKET: '{{ .VOLSYNC_S3_BUCKET | default "volsync-kopia" }}'
        DATABASE_S3_BUCKET: '{{ .DATABASE_S3_BUCKET | default "database" }}'
  dataFrom:
    - extract:
        key: synology_backup
