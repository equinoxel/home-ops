---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app synology-backup
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
          backoffLimit: 2
        containers:
          app:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.75.2
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                echo "=== [$(date -u '+%Y-%m-%d %H:%M:%S')] Starting Synology Backup ==="

                echo "--- 1. Syncing VolSync S3 bucket: ${VOLSYNC_S3_BUCKET:-volsync-kopia} ---"
                rclone sync ":s3:${VOLSYNC_S3_BUCKET:-volsync-kopia}" "/destination/volsync-kopia" \
                  --s3-provider="Other" \
                  --s3-endpoint="${AWS_S3_ENDPOINT}" \
                  --s3-access-key-id="${AWS_ACCESS_KEY_ID}" \
                  --s3-secret-access-key="${AWS_SECRET_ACCESS_KEY}" \
                  --s3-force-path-style=true \
                  --fast-list \
                  --transfers=4 \
                  --checkers=8 \
                  --stats=30s \
                  -v

                if [ -n "${DATABASE_S3_BUCKET:-}" ]; then
                  echo "--- 2. Syncing Database S3 bucket: ${DATABASE_S3_BUCKET} ---"
                  rclone sync ":s3:${DATABASE_S3_BUCKET}" "/destination/database" \
                    --s3-provider="Other" \
                    --s3-endpoint="${AWS_S3_ENDPOINT}" \
                    --s3-access-key-id="${AWS_ACCESS_KEY_ID}" \
                    --s3-secret-access-key="${AWS_SECRET_ACCESS_KEY}" \
                    --s3-force-path-style=true \
                    --fast-list \
                    --transfers=4 \
                    --checkers=8 \
                    --stats=30s \
                    -v
                fi

                if [ -d "/source/photos" ]; then
                  echo "--- 3. Syncing TrueNAS Photos from /source/photos to /destination/photos ---"
                  rclone sync "/source/photos" "/destination/photos" \
                    --backup-dir="/destination/photos-deleted/$(date -u '+%Y-%m-%d')" \
                    --delete-excluded \
                    --transfers=4 \
                    --checkers=8 \
                    --stats=30s \
                    -v
                else
                  echo "WARN: /source/photos directory not found or unmounted, skipping photos sync."
                fi

                echo "=== [$(date -u '+%Y-%m-%d %H:%M:%S')] Synology Backup Completed Successfully ==="
            envFrom:
              - secretRef:
                  name: synology-backup-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      destination:
        type: nfs
        server: ${SYNOLOGY_NFS_SERVER}
        path: ${SYNOLOGY_NFS_PATH}
        globalMounts:
          - path: /destination
      source-photos:
        type: nfs
        server: ${TRUENAS_NFS_SERVER}
        path: ${TRUENAS_PHOTOS_NFS_PATH}
        globalMounts:
          - path: /source/photos
            readOnly: true
