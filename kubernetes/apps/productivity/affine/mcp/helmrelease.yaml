---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app affine-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dawncr0w/affine-mcp-server
              tag: latest
            env:
              MCP_TRANSPORT: "http"
              PORT: &port 3000
              AFFINE_BASE_URL: "http://affine.productivity.svc.cluster.local:3010"
              AFFINE_ALLOW_INSECURE_HTTP: "true"
              AFFINE_MCP_AUTH_MODE: "bearer"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "affine-mcp.laurivan.com"
        parentRefs:
          - name: envoy-internal
            namespace: network-system
