---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name affine-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        AFFINE_EMAIL: '{{ .AFFINE_EMAIL }}'
        AFFINE_PASSWORD: '{{ .AFFINE_PASSWORD }}'
        AFFINE_MCP_HTTP_TOKEN: '{{ .AFFINE_MCP_HTTP_TOKEN }}'
  dataFrom:
    - extract:
        key: *name
