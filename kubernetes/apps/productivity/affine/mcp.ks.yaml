---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: affine-mcp
  namespace: productivity
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: affine
  dependsOn:
    - name: affine
      namespace: productivity
  interval: 1h
  path: ./kubernetes/apps/productivity/affine/mcp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  timeout: 5m
  wait: false
