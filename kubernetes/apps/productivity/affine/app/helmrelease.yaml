---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app affine
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          db-init:
            image:
              repository: docker.io/library/postgres
              tag: 18-alpine
            env:
              PGHOST: postgres-cluster-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: postgres
            envFrom:
              - secretRef:
                  name: affine-pginit
              - secretRef:
                  name: "{{ .Release.Name }}"
            command: ["/bin/sh"]
            args: ["-c", "psql -c \"ALTER ROLE affine WITH PASSWORD '$${AFFINE_DB_PASSWORD}';\""]
            securityContext:
              allowPrivilegeEscalation: false
          migration:
            image:
              repository: ghcr.io/toeverything/affine
              tag: stable
            command:
              - sh
              - -c
              - node ./scripts/self-host-predeploy.js
            env:
              REDIS_SERVER_HOST: localhost
              REDIS_SERVER_PORT: 6379
              AFFINE_INDEXER_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            securityContext:
              allowPrivilegeEscalation: false
        containers:
          app:
            image:
              repository: ghcr.io/toeverything/affine
              tag: stable
            env:
              REDIS_SERVER_HOST: localhost
              REDIS_SERVER_PORT: 6379
              AFFINE_INDEXER_ENABLED: "false"
              AFFINE_SERVER_EXTERNAL_URL: https://affine.laurivan.com
              PORT: &port 3010
              HOST: 0.0.0.0
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "affine.laurivan.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      storage:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /root/.affine/storage
      config:
        type: secret
        name: "{{ .Release.Name }}"
        globalMounts:
          - path: /root/.affine/config/config.json
            subPath: config.json
