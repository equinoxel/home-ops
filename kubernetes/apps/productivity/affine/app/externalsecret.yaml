---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name affine
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: 'postgresql://affine:{{ .AFFINE_DB_PASSWORD | default .AFFINE_ADMIN_PASSWORD }}@postgres-cluster-rw.database.svc.cluster.local:5432/affine?sslmode=disable'
        AFFINE_DB_PASSWORD: '{{ .AFFINE_DB_PASSWORD | default .AFFINE_ADMIN_PASSWORD }}'
        AFFINE_ADMIN_EMAIL: '{{ .AFFINE_ADMIN_EMAIL }}'
        AFFINE_ADMIN_PASSWORD: '{{ .AFFINE_ADMIN_PASSWORD }}'
        AFFINE_SERVER_EXTERNAL_URL: '{{ .AFFINE_SERVER_EXTERNAL_URL | default "https://affine.laurivan.com" }}'
        AFFINE_OIDC_CLIENT_ID: '{{ .AFFINE_OIDC_CLIENT_ID }}'
        AFFINE_OIDC_CLIENT_SECRET: '{{ .AFFINE_OIDC_CLIENT_SECRET }}'
        AFFINE_OIDC_ISSUER: '{{ .AFFINE_OIDC_ISSUER | default "https://auth.laurivan.com/application/o/affine/" }}'
        config.json: |
          {
            "$schema": "https://github.com/toeverything/affine/releases/latest/download/config.schema.json",
            "server": {
              "name": "AFFiNE",
              "externalUrl": "{{ .AFFINE_SERVER_EXTERNAL_URL | default "https://affine.laurivan.com" }}"
            },
            "oauth": {
              "providers": {
                "oidc": {
                  "clientId": "{{ .AFFINE_OIDC_CLIENT_ID }}",
                  "clientSecret": "{{ .AFFINE_OIDC_CLIENT_SECRET }}",
                  "issuer": "{{ .AFFINE_OIDC_ISSUER | default "https://auth.laurivan.com/application/o/affine/" }}",
                  "args": {
                    "scope": "openid profile email"
                  }
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: *name
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-pginit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: affine-pginit
    template:
      data:
        PGUSER: '{{ .POSTGRES_SUPER_USER }}'
        PGPASSWORD: '{{ .POSTGRES_SUPER_PASS }}'
  dataFrom:
    - extract:
        key: cloudnative_pg
