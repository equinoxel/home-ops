---
# yaml-language-server: $schema=https://schemas.tholinka.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: devices
spec:
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - zigbee.iot.internal
        - zwave.iot.internal
        - garage.iot.internal

        - bedroom.air.iot.internal
        - outdoor.air.iot.internal

        - fridge.plugs.iot.internal
        - dehumidifier.plugs.iot.internal
        - cluster.plugs.iot.internal
        - freezer.plugs.iot.internal
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nfs
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # Literal NAS IP, not nas.servers.internal — this probe must not depend
        # on Pi-hole DNS being up (Pi-hole down would fail the probe, which in
        # turn holds the kopia KEDA scaler at 0). See components/keda/nfs-scaler.
        - 192.168.2.44:2049
  metricRelabelings:
    - targetLabel: instance
      replacement: 192.168.2.44:2049
      action: replace
