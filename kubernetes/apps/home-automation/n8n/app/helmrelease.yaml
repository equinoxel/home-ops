---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: docker.io/n8nio/n8n
              tag: 2.48.1
            env:
              TZ: Europe/Bucharest
              GENERIC_TIMEZONE: Europe/Bucharest
              N8N_PORT: &port 5678
              N8N_HOST: n8n.laurivan.com
              N8N_PROTOCOL: https
              WEBHOOK_URL: https://n8n.laurivan.com/
              N8N_EDITOR_BASE_URL: https://n8n.laurivan.com/
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          http:
            port: *port
            appProtocol: kubernetes.io/ws
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: n8n
          gethomepage.dev/group: Home Automation
          gethomepage.dev/icon: n8n.svg
        hostnames:
          - "n8n.laurivan.com"
        parentRefs:
          - name: envoy-internal
            namespace: network-system
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node/.n8n
