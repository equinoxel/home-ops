---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"iot",
                "namespace": "network-system",
                "ips": ["192.168.20.70/24"],
                "mac": "02:97:87:58:7b:10"
              }]
        initContainers:
          init-config:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - |
                if [ ! -f "/config/configuration.yaml" ]; then
                  echo "Creating initial configuration.yaml..."
                  printf "%s\n" \
                    "# Loads default set of integrations. Do not remove." \
                    "default_config:" \
                    "" \
                    "# Load frontend themes from the themes folder" \
                    "frontend:" \
                    "  themes: !include_dir_merge_named themes" \
                    "" \
                    "automation: !include automations.yaml" \
                    "script: !include scripts.yaml" \
                    "scene: !include scenes.yaml" \
                    "" \
                    "http:" \
                    "  use_x_forwarded_for: true" \
                    "  trusted_proxies:" \
                    "    - 10.42.0.0/16" \
                    "    - 10.43.0.0/16" \
                    "    - 192.168.20.0/24" \
                    "    - 192.168.2.0/24" > /config/configuration.yaml
                  touch /config/automations.yaml /config/scripts.yaml /config/scenes.yaml
                elif ! grep -q "trusted_proxies" "/config/configuration.yaml"; then
                  echo "Appending reverse proxy settings to configuration.yaml..."
                  printf "\nhttp:\n  use_x_forwarded_for: true\n  trusted_proxies:\n    - 10.42.0.0/16\n    - 10.43.0.0/16\n    - 192.168.20.0/24\n    - 192.168.2.0/24\n" >> /config/configuration.yaml
                fi
          init-hacs:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - |
                if [ ! -d "/config/custom_components/hacs" ]; then
                  echo "Installing HACS..."
                  mkdir -p /config/custom_components/hacs
                  wget -qO /tmp/hacs.zip "https://github.com/hacs/integration/releases/latest/download/hacs.zip"
                  unzip -q -o /tmp/hacs.zip -d /config/custom_components/hacs
                  rm -f /tmp/hacs.zip
                  echo "HACS installation complete."
                else
                  echo "HACS is already installed."
                fi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.4.4@sha256:589e4c1c93025d01320c14329427197c8b52d4f2e241a6bc1d6207837e07b4a7
            env:
              HASS_HTTP_TRUSTED_PROXY_1: 192.168.20.0/24
              HASS_HTTP_TRUSTED_PROXY_2: 10.69.0.0/16
              HASS_HTTP_TRUSTED_PROXY_3: 10.42.0.0/16
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            args:
              - --log-file
              - /config/logs/home-assistant.log
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ['ALL'] }
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.118.0@sha256:4aff9947c113487113201da811564fade1af5f23038b4d683998d024eebbac92
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - '12321'
              - /config
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      # nodeSelector:
      #   node.kubernetes.io/ha: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            primary: true
            appProtocol: kubernetes.io/ws
            port: 8123
          code-server:
            port: &code 12321
    route:
      app:
        hostnames:
          - ha.laurivan.com
        parentRefs:
          - name: envoy-internal
            # TODO: Make it external after testing so it connects to the app
            namespace: network-system
      code: # split so it's not external, and we can ext-auth it as well
        hostnames:
          - ha-code.laurivan.com
        parentRefs:
          - name: envoy-internal
            namespace: network-system
        rules:
          - backendRefs:
              - name: *app
                port: *code
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/name: Home Assistant Code Server
          gethomepage.dev/group: Dev Tools
          gethomepage.dev/icon: code-server.webp
          gethomepage.dev/pod-selector: app.kubernetes.io/name=home-assistant
    serviceMonitor:
      app:
        endpoints:
          - port: http
            scheme: http
            path: /api/prometheus
            interval: 1m
            scrapeTimeout: 10s
            authorization:
              credentials:
                name: home-assistant-auth-secret
                key: HASS_LONG_LIVED_TOKEN
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      config-venv:
        existingClaim: home-assistant-cache
        globalMounts:
          - path: /config/.venv
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /config/.cache
            subPath: cache
          - path: /config/logs
            subPath: logs
          - path: /config/tts
            subPath: tts
          - path: /tmp
            subPath: tmp
          - path: /config/.vscode/logs
            subPath: vscode-logs
          - path: /config/.vscode/User/caches
            subPath: vscode-caches
          - path: /config/.vscode/User/workspaceStorage
            subPath: vscode-workspace-storage
