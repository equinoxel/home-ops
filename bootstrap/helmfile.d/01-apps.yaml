---

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.19.4
    values: ['./templates/values.yaml.gotmpl']

  - name: coredns
    namespace: kube-system
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.45.2
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/cilium']

  - name: spegel
    namespace: kube-system
    chart: oci://ghcr.io/spegel-org/helm-charts/spegel
    version: 0.7.1
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/coredns']

  # cert-manager runs in the "security" namespace in this repo (see
  # kubernetes/apps/security/cert-manager). The namespace here doubles as the
  # apps-dir used by templates/values.yaml.gotmpl to locate the HelmRelease
  # values, so it must be "security", not "cert-manager".
  - name: cert-manager
    namespace: security
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.20.2
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/spegel']

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.43.0
    values: ['./templates/values.yaml.gotmpl']
    needs: ['security/cert-manager']

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.43.0
    values: ['./templates/values.yaml.gotmpl']
    needs: ['flux-system/flux-operator']
