---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.2.155:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "192.168.2.155"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  #
  # CONTROL PLANE NODES
  #
  - hostname: "ctrl-01-esxi"
    ipAddress: "192.168.2.57"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/43a1a6104d8dcd6547983f4ed13abb6f5e8a1b2fdad796c69e7db6e95d122884
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "34:97:87:58:cb:00"
        dhcp: false
        addresses:
          - "192.168.2.57/24"
        routes:
          - gateway: "192.168.2.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "192.168.2.155"
    patches:
      - "@./patches/worker/fast-disk.yaml"

  #
  # WORKERS
  #
  - hostname: "worker-01-esxi"
    ipAddress: "192.168.2.7"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/43a1a6104d8dcd6547983f4ed13abb6f5e8a1b2fdad796c69e7db6e95d122884
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "84:97:87:58:ab:00"
        dhcp: false
        addresses:
          - "192.168.2.7/24"
        routes:
          - gateway: "192.168.2.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "192.168.2.155"
    patches:
      - "@./patches/worker/fast-disk.yaml"


# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  # - "@./patches/global/machine-hugepages.yaml"
  # - "@./patches/global/machine-time.yaml" # Talos v1.12+ uses TimeSyncConfig; defaults to time.cloudflare.com
  - "@./patches/global/network.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"
